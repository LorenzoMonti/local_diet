services:
  dieta:
    build: .
    container_name: dieta
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DIETA_PORT:-8000}:8000"   # porta sull'host: DIETA_PORT nel .env
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # per raggiungere un eventuale Ollama sull'host

  # Anonimizzazione locale dei referti: https://github.com/Rizzo-AI-Academy/rizzo-pii
  # Nessuna porta pubblicata: è raggiungibile solo dal container "dieta" sulla rete interna.
  # Opzionale: si avvia solo con  docker compose --profile pii up -d  (e PII_MODE=rizzo nel .env).
  # Il primo build scarica il modello (~1.2 GB) e richiede circa 10-20 minuti.
  rizzo-pii:
    build:
      context: https://github.com/Rizzo-AI-Academy/rizzo-pii.git#30d6f9c675e245bc8494df959adaeaa9d8de35c7
      args:
        MODEL_REPO: rizzoaiacademy/rizzo-pii-0.3B
        MODEL_REVISION: v1.5.0
    profiles: ["pii"]
    image: rizzo-pii:local
    container_name: rizzo-pii
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: 4
    deploy:
      resources:
        limits:
          memory: 4G
    security_opt:
      - no-new-privileges:true
